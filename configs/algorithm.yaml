# FluxPhased Algorithm & Training Parameters
# These affect algorithm behavior but have no direct physical meaning

model:
  num_input_length: 32    # radar encoder -> commander latent width
  num_output_length: 16   # commander -> radar decoder instruction width
  fft_size: 0              # FFT size (0 = auto next-power-of-2)

training:
  max_steps: 10000
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  n_epochs: 10
  batch_size: 64
  buffer_size: 2048

evaluation:
  confidence: 0.95
  half_width: 0.05
  max_episodes: 500
  min_episodes: 20
