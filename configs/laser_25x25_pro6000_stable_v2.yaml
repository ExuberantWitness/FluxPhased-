# ============================================================================
# PRO 6000 STABLE v2 — revert log_std_floor to verified -6.0 (fine-kr exploration-noise fix)
# ============================================================================
# WHAT: multi-agent PSRO-lite league (red=training vs blue=opponent pool),
#       laser precise-kill. Based on the VERIFIED p14 baseline that reached
#       kr=0.20m on a 4090 (num_envs=2); here SCALED UP for the 98GB GPU.
# RUN:  python -m training.train_laser --config configs/laser_25x25_pro6000.yaml
# PASS: kr should descend 50m -> ~0.20m; eval aim 0m; cum red>0.8, blue=0.0.
#       See AGENT_TEST_PRO6000.md for full success criteria + VRAM tuning.
# NOTE: checkpoint_dir is PERSISTENT (checkpoints/), never /tmp — /tmp filled
#       the disk to 100% and crashed torch.save on the 4090.
# ============================================================================

sub_array_size: 5

league:
  population_cap: 30            # [scaled 10->30] bigger opponent pool on 98GB
  episodes_per_training: 10     # [scaled 5->10] more rollout data per PSRO iter
  max_steps_per_episode: 500    # 500 pulses = 50ms (proven; reaches 0.2m fast)
  checkpoint_dir: "checkpoints/laser_pro6000"   # PERSISTENT disk — NOT /tmp
  n_eval_games: 10

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 3
    batch_size: 256             # [scaled 128->256] larger batch w/ more envs
    buffer_size: 2048           # [scaled 512->2048] more transitions per update
    buffer_size_commander: 2048
    buffer_size_radar: 2048
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 20           # Phase 1: [scaled 24->48] for 12-24h PPO 收敛 (plan §1.6)
  league: true                  # multi-agent PSRO-lite (red vs frozen pool)
  league_snapshot_every: 3
  # Phase 1.0 改动 1 (plan §1.0): F8 reward_normalize — 之前 train_laser 默认不开
  reward_normalize: true
  # --- below: IDENTICAL to verified p14 (do NOT change — these reach 0.2m) ---
  hybrid_fire: true
  residual_aim: true
  residual_scale_m: 6.0
  kill_radius_init: 50.0
  bc_pretrain_iters: 0
  cmd_bc_weight_init: 5.0
  cmd_bc_weight_final: 2.0
  cmd_bc_decay_iters: 24
  log_std_init: -1.0
  log_std_floor: -6.0
  log_std_decay: 0.40

reward_shaping:
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 100.0
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 2.0
  illum_reward_weight: 50.0
  fire_lock_bonus: 5.0
  misfire_penalty: 0.5
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05
  # Phase 1.0 改动 2b (plan T1): 全场稠密 dartboard reward
  # per-step 都给 (不只 fire_on),fire_on 时额外加权 0.5×。
  # weight=50 同 guidance 量级,kill_bonus=100 仍稀疏奖励。
  dartboard_weight: 0.0
  dartboard_scale_m: 5.0

env:
  min_radar_baseline_m: 5000.0  # 方案1: ≥5km deployment baseline (key to 0.2m)
  rows: 25
  cols: 25
  num_envs: 12                  # [scaled 2->12] 98GB headroom; ~3GB fixed + ~6GB/env.
                                # Agent: watch nvidia-smi, can push to 16 if VRAM allows.
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.24
  illumination_time_s: 0.002
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]

# 方案2: realistic S-300/S-400 crossrange + Kalman time-averaging (robust 0.2m)
sensing_noise:
  mode: tracked
  track_q_m: 0.02
  track_burnin: 120
  acq_baseline_m: 0.0
  range_sigma_m: 0.05
  crossrange_factor: 7.4e-5
