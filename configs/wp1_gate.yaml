# ============================================================================
# WP1 CONVERGENCE GATE CONFIG — prove FluxLeague converges (PAPER_PLAN_EAAI §WP1)
# ============================================================================
# WHAT: 1 seed × 30 iters of FluxLeague (full 3-role + Nash + TC-DAMS + CTDE +
#       curriculum) with stabilized eval (n_eval=50) and slow kr anneal.
# WHY:  Gate before spending WP2/WP3 GPU. If FluxLeague can't reach ≤0.5m kr
#       and <10% residual 0.5 rate, the league contribution is dead and paper
#       must pivot to C1-only + train_laser PSRO-lite.
# SOURCE: configs/laser_25x25_pro6000_league.yaml + EXPERIMENT_DESIGN_Q1.md §7:
#         n_eval=50, max_steps=500, kr_init=100, kr_decay=0.7, kr_threshold=0.7.
# PASS: scripts/wp1_validate.py logs/wp1_gate_seed42.log exits 0 iff:
#         (1) final kill_radius ≤ 0.5m (ideal) or ≤ 1m (minimum acceptable)
#         (2) residual 0.50 win_rate ratio < 10%
#         (3) final NashConv < 0.05 OR monotonically decreasing across iters
#         (4) kill_radius anneal is monotonic (no rebound)
# RUN:   python -m training.train --config configs/wp1_gate.yaml \
#          2>&1 | tee logs/wp1_gate_seed42.log
# GPU:   ~60 GPU-h on PRO 6000 (~2.5 days wall-clock for 30 iters).
# ============================================================================

task_type: laser
sub_array_size: 5

league:
  population_cap: 12
  n_eval_games: 50             # WP1 §7: was 8 — 6.25× longer for variance reduction
  meta_solver: "nash"
  pfsp_temperature: 1.0
  exploiter_reset_prob: 0.1
  episodes_per_training: 10
  max_steps_per_episode: 500
  checkpoint_dir: "checkpoints/wp1_gate_seed42"
  use_elo_band: true
  elo_band_init: 400.0
  elo_band_final: 100.0
  elo_anneal_iters: 18
  alpha_schedule: linear
  team_critic_enabled: true
  tcdams_lambda: 0.3
  mutation:
    enabled: true
    epsilon: 0.05
    n_mutants_per_policy: 2
    n_top_policies: 1
    win_rate_threshold: 0.55

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 3
    batch_size: 256
    buffer_size: 2048
    buffer_size_commander: 2048
    buffer_size_radar: 512
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 30          # WP1: 30 iters (was 24 in base) — full convergence horizon
  kill_radius_init: 100.0      # WP1 §7: was 50 — start wider so first anneal isn't freebie
  kill_rate_threshold: 0.7     # WP1 §7: was 0.5 — require stable wins before tightening
  kill_radius_decay: 0.7       # WP1 §7: was 0.5 — anneal 30% per step (not 50%) for smoothness
  residual_aim: true
  residual_scale_m: 6.0
  hybrid_fire: true
  decouple_value: true
  warmup_episodes: 0
  critic_pretrain_episodes: 0
  bc_pretrain_epochs: 0

reward_shaping:
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 100.0
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 5.0
  illum_reward_weight: 50.0
  fire_lock_bonus: 5.0
  misfire_penalty: 0.5
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05

env:
  min_radar_baseline_m: 5000.0
  rows: 25
  cols: 25
  num_envs: 12
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.2
  illumination_time_s: 0.002
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]

sensing_noise:
  mode: tracked
  track_q_m: 0.02
  track_burnin: 120
  acq_baseline_m: 0.0
  range_sigma_m: 0.05
  crossrange_factor: 7.4e-5
