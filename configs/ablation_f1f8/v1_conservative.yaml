# ============================================================================
# PRO 6000 (Blackwell 98GB) ALPHA-STYLE LEAGUE CONFIG — laser precise-kill
# ============================================================================
# WHAT: 3-role AlphaStar-style league (MAIN + MAIN_EXPLOITER + LEAGUE_EXPLOITER)
#       per team, PFSP + Elo-band + Nash meta-solver. Laser precise-kill task.
# WHY:  Replace train_laser.py inline PSRO-lite (single opponent sample per
#       iter) with full FluxLeague, which is dormant in the repo. Goal is to
#       drive iter 17-19 blue win-rate oscillation (8% in baseline) to ~0.00
#       by exposing both teams to a balanced opponent mixture (PFSP + Nash).
# RUN:  python -m training.train --config configs/laser_25x25_pro6000_league.yaml
# PASS: kr descends 50m → 0.2m (success-gated); cum red≥0.90, blue≈0.00; pool
#       size = 12 (3 roles × 2 teams × 2 generations cap).
# VRAM: 6 trainers × radar buffer(32) + env(12) + models + team_critic.
#       Conservative; if OOM, see OOM fallback in plan.
# ============================================================================

task_type: laser
sub_array_size: 5

# ════════════════════════════════════════════════════════════════════
# VARIANT v1 — CONSERVATIVE: lift kill_bonus 100→20000 to match
# cumulative shaping magnitude. Single-knob fix.
# Purpose: test if the 200:1 reward ratio is the root cause.
# Expected: if ratio is the cause, PPO policy_loss recovers + kill_rate
#           rises. Other shaping terms (illum=50, commit=8) unchanged.
# ════════════════════════════════════════════════════════════════════

league:
  population_cap: 12           # 3 roles × 2 teams × 2 generations
  n_eval_games: 8              # enough for stable payoff (per pair)
  meta_solver: "nash"          # AlphaStar default; nashConv tracked
  pfsp_temperature: 1.0
  pfsp_hardness_p: 1.0   # R3: AlphaStar f_hard(x)=(1-x)^p. 1.0=linear in difficulty.
  # R1+R2: AlphaStar Main Agent opponent distribution.
  self_play_prob_ma: 0.5          # per-slot P(self-play); AlphaStar uses 0.5.
  n_opponents_per_cycle_ma: 4     # K opponents per cycle (AlphaStar uses 4-8).
  exploiter_reset_prob: 0.1
  episodes_per_training: 10
  max_steps_per_episode: 500   # 500 pulses = 50ms dwell window (proven)
  checkpoint_dir: "checkpoints/laser_pro6000_league_v1_conservative"
  use_elo_band: false          # F-ablation: bypass Elo-band (re-introduces R3 PFSP bug); use pure PFSP
  elo_band_init: 400.0
  elo_band_final: 100.0
  elo_anneal_iters: 18
  alpha_schedule: linear       # 0→1 over iters; team advantage
  team_critic_enabled: true    # CTDE
  tcdams_lambda: 0.3
  mutation:
    enabled: true
    epsilon: 0.05
    n_mutants_per_policy: 2
    n_top_policies: 1
    win_rate_threshold: 0.55

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 3
    batch_size: 256
    buffer_size: 2048
    buffer_size_commander: 2048
    buffer_size_radar: 512     # >2× batch_size=256 so PPO update actually fires;
                               # 6 trainers × 163k obs × 512 ~2GB total — fits 98GB easily
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 24          # Match baseline horizon
  kill_radius_init: 50.0       # Success-gated → 0.2m via _anneal_kill_radius
  kill_rate_threshold: 0.7     # F-ablation: stricter gate (was 0.5)
  kill_radius_decay: 0.7       # F-ablation: slower descent (was 0.5)
  reward_normalize: false      # v4 control: F8 disabled
  residual_aim: true
  residual_scale_m: 6.0
  hybrid_fire: true
  decouple_value: true
  # v2 ablation: fire_init_logit=0.0 — kill the "training-before-kill" artifact.
  fire_init_logit: 0.0
  # F3: floor on commander log_std. -3.0 → σ ≥ 0.05 (~50m at 3km half_map).
  # Prevents the σ ≈ 2.5e-3 collapse that amplifies residual-aim log_prob
  # spikes into NaN crashes (LASER_LEAGUE_NAN_FULL_ANALYSIS §5).
  log_std_floor: -3.0
  warmup_episodes: 0
  critic_pretrain_episodes: 0
  bc_pretrain_epochs: 0

reward_shaping:
  # All laser-specific terms consumed by LaserRewardShaper.
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 500000.0            # v2: 100→500000 (≥25× cumulative, more aggressive than v4)
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 5.0
  illum_reward_weight: 50.0
  fire_lock_bonus: 5.0
  misfire_penalty: 0.5
  # Tier 1.2: Fire-commitment reward (attacks "50% Bernoulli fire head never
  # sustains 4 control steps" failure mode).
  fire_commitment_weight: 10.0    # v2: 8→10
  fire_commitment_cap: 4.0   # 4 control steps × 5 pulses = 20 pulses = 2ms dwell
  fire_commitment_exp: 2.0
  # v2 ablation: aim-progress dense reward (same as v4 — test if bigger kill_bonus alone differentiates)
  aim_progress_weight: 20.0
  aim_progress_clip_m: 500.0
  # Tier 1.2: Superlinear sustained-dwell exponent (2 = quadratic, 3 = cubic)
  illum_dwell_exp: 2.0
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05

env:
  min_radar_baseline_m: 5000.0   # ≥5km deployment baseline (key to 0.2m)
  rows: 25
  cols: 25
  num_envs: 12                  # 98GB headroom; ~3GB fixed + ~6GB/env
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.2            # final curriculum target
  illumination_time_s: 0.002    # 2ms dwell for kill
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]

sensing_noise:
  mode: tracked
  track_q_m: 0.02
  track_burnin: 120
  acq_baseline_m: 0.0
  range_sigma_m: 0.05
  crossrange_factor: 7.4e-5
