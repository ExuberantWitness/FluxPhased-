# FluxPhased Quick Pipeline Test — 5 episodes, minimal epochs
# Purpose: verify full pipeline (BC→Critic→PPO + TeamCritic) before committing to 50-episode run.
# Target GPU: RTX PRO 6000 Blackwell (96 GB VRAM)

sub_array_size: 5

league:
  population_cap: 50
  n_eval_games: 4            # fast eval
  meta_solver: "nash"
  pfsp_temperature: 1.0
  exploiter_reset_prob: 0.1
  episodes_per_training: 5   # minimal training episodes
  max_steps_per_episode: 800   # 1/2.5 of full run; missile flight ~600 steps
  checkpoint_dir: "checkpoints/league_quick_test"

  mutation:
    enabled: false           # skip mutation overhead

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_step_returns: 400
    value_coef: 0.5
    max_grad_norm: 0.5
    n_epochs: 2               # quick
    batch_size: 128
    buffer_size: 2048
    buffer_size_commander: 2048
    buffer_size_radar: 2048

training:
  warmup_episodes: 0
  psro_iterations: 3         # just 3 iterations for smoke test

  critic_pretrain_episodes: 5     # 1/10th of full run
  critic_pretrain_epochs: 10      # reduced from 50
  bc_pretrain_epochs: 5           # reduced from 20
  bc_pretrain_batch_size: 128

reward_shaping:
  detect_snr_weight: 0.1
  detect_coverage_weight: 0.03
  jam_effectiveness_weight: 0.1
  comm_reliability_weight: 0.05
  recon_intel_weight: 0.03
  beam_accuracy_weight: 0.05
  stealth_weight: 0.1
  missile_guidance_weight: 0.02
  snr_threshold_db: 10.0
  urgency_penalty: -0.05
  team_reward_weight: 0.1
  team_kill_weight: 1.0

privileged_critic:
  enabled: true
  encoder_hidden: [512, 256]

env:
  rows: 25
  cols: 25
  num_envs: 4
  n_radars: 4
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  cpi_preallocate: false
  speed_ms: 62500.0
