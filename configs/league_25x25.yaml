# FluxPhased League Training Configuration — 25×25 Array
# Sub-Array Decomposed Policy (SADP): 25 sub-arrays of 5×5 blocks
# Action space: 25×22+3 = 553 (expanded internally to 625×22+3 = 13753)

sub_array_size: 5  # 5×5 sub-array blocks → 25 sub-arrays for 25×25 array

league:
  population_cap: 20
  n_eval_games: 50
  meta_solver: "nash"
  pfsp_temperature: 1.0
  exploiter_reset_prob: 0.1
  episodes_per_training: 1000
  max_steps_per_episode: 1000
  checkpoint_dir: "checkpoints/league_25x25"

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.99
    gae_lambda: 0.95
    value_coef: 0.5
    max_grad_norm: 0.5
    n_epochs: 10
    batch_size: 64
    buffer_size: 2048

curriculum:
  phase_a_episodes: 5000
  phase_b_episodes: 10000
  phase_c_iterations: 20
  phase_c_episodes_per_iter: 1000
  phase_d_episodes: 10000

reward_shaping:
  detect_snr_weight: 0.1
  detect_coverage_weight: 0.05
  jam_effectiveness_weight: 0.1
  comm_reliability_weight: 0.05
  recon_intel_weight: 0.03
  beam_accuracy_weight: 0.02
  snr_threshold_db: 10.0

env:
  rows: 25
  cols: 25
  num_envs: 1
  n_radars: 4
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0  # Standard 1W for 25×25 (625 elements, D≈33 dBi)
