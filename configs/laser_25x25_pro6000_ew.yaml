# ============================================================================
# PRO 6000 (Blackwell 98GB) — INTEGRATED-EW FRONTIER config (agent testing)
# ============================================================================
# WHAT: pro6000 league + integrated electronic warfare. On top of the laser
#       precise-kill baseline, adds: jamming degrades enemy localization
#       (jam_gain), a kill-fast/survive race, and the ③ emission-exposure
#       tradeoff (home-on-jam beacon → jamming must be TIMED, not max).
# BASE: configs/laser_25x25_ew_exposure.yaml (the run that previously CRASHED
#       on the /tmp disk-full bug), with EW/precision params UNCHANGED and only
#       98GB scale knobs raised. checkpoint_dir is persistent (not /tmp).
# RUN:  python -m training.train_laser --config configs/laser_25x25_pro6000_ew.yaml
# STATUS: ⚠️ FRONTIER / NOT YET VERIFIED to convergence. Run the baseline
#         (laser_25x25_pro6000.yaml) FIRST and confirm it PASSes, then this.
# EXPECT: kr reaches ~0.2m by ~iter17, THEN jam emerges (jam>0) in the tight-kr
#         regime as a timed intermediate (not max). See AGENT_TEST_PRO6000.md §6.
# ============================================================================

sub_array_size: 5

league:
  population_cap: 30            # [scaled 10->30]
  episodes_per_training: 10     # [scaled 5->10]
  max_steps_per_episode: 500
  checkpoint_dir: "checkpoints/laser_pro6000_ew"   # PERSISTENT — NOT /tmp
  n_eval_games: 10

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 3
    batch_size: 256             # [scaled 128->256]
    buffer_size: 2048           # [scaled 512->2048]
    buffer_size_commander: 2048
    buffer_size_radar: 2048
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 30           # EW needs the extra iters for jam emergence/equilibrium
  league: true
  league_snapshot_every: 3
  # --- precision baseline (verified, unchanged) ---
  hybrid_fire: true
  residual_aim: true
  residual_scale_m: 6.0
  kill_radius_init: 50.0
  bc_pretrain_iters: 0
  cmd_bc_weight_init: 5.0
  cmd_bc_weight_final: 2.0
  cmd_bc_decay_iters: 12
  log_std_init: -1.0
  log_std_floor: -6.0
  log_std_decay: 0.40
  # --- integrated-EW (unchanged from ew_exposure) ---
  jam_log_std: -1.0             # JAM dim NOT annealed — keeps exploring jam=0..1
  jam_kr_threshold_m: 0.5       # jamming turns ON only once kr tightens to 0.5m
  commander_privileged_dim: 10  # CTDE jamming-aware privileged critic

reward_shaping:
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 100.0
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 2.0
  illum_reward_weight: 50.0
  fire_lock_bonus: 5.0
  misfire_penalty: 0.5
  # --- integrated-EW race + emission-exposure (unchanged) ---
  race_time_cost: 0.01
  race_death_penalty: 30.0
  jam_gain: 8.0                 # enemy jam ×(1+8·jam) on MY sensing σ
  jam_cost: 0.01
  exposure_gain: 50.0           # ③ home-on-jam beacon ∝ jam² → timed jam, not max
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05

env:
  min_radar_baseline_m: 5000.0
  rows: 25
  cols: 25
  num_envs: 12                  # [scaled 2->12] watch nvidia-smi; up to 16 if VRAM allows
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.2
  illumination_time_s: 0.002
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]

sensing_noise:
  mode: tracked
  track_q_m: 0.02
  track_burnin: 120
  acq_baseline_m: 0.0
  range_sigma_m: 0.05
  crossrange_factor: 7.4e-5
