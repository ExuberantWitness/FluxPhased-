# FluxPhased League Training - TC-DAMS ablation (25×25)
# Compact config for small-scale ablation runs.
# For full-scale runs, use configs/league_tcdams.yaml.

league:
  population_cap: 10
  n_eval_games: 5
  meta_solver: "nash"
  pfsp_temperature: 1.0
  exploiter_reset_prob: 0.1
  episodes_per_training: 50
  max_steps_per_episode: 50
  checkpoint_dir: "checkpoints/league_tcdams5/R0"
  tcdams_lambda: 0.3
  use_elo_band: false
  elo_band_init: 400.0
  elo_band_final: 100.0
  elo_anneal_iters: 6

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.99
    gae_lambda: 0.95
    value_coef: 0.5
    max_grad_norm: 0.5
    n_epochs: 5
    batch_size: 32
    buffer_size: 256

training:
  warmup_episodes: 0
  psro_iterations: 5

reward_shaping:
  detect_snr_weight: 0.1
  detect_coverage_weight: 0.05
  jam_effectiveness_weight: 0.1
  comm_reliability_weight: 0.05
  recon_intel_weight: 0.03
  beam_accuracy_weight: 0.02
  stealth_weight: 0.1
  snr_threshold_db: 10.0

privileged_critic:
  enabled: true
  encoder_hidden: [512, 256]

env:
  rows: 25
  cols: 25
  num_envs: 1
  n_radars: 4
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
