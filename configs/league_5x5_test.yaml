# FluxPhased League Training Configuration — 5×5 Quick Test
# Minimal config to verify end-to-end pipeline: HPEDF → Critic Pretrain → PSRO

sub_array_size: 5

league:
  population_cap: 10
  n_eval_games: 5
  meta_solver: "nash"
  pfsp_temperature: 1.0
  exploiter_reset_prob: 0.1
  episodes_per_training: 50   # minimal for testing
  max_steps_per_episode: 400  # shorter episodes for quick test
  checkpoint_dir: "checkpoints/league_5x5_test"

  mutation:
    enabled: true
    epsilon: 0.05
    n_mutants_per_policy: 2
    n_top_policies: 1
    win_rate_threshold: 0.55

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.99
    gae_lambda: 0.95
    value_coef: 0.5
    max_grad_norm: 0.5
    n_epochs: 3
    batch_size: 64
    buffer_size: 1024
    buffer_size_commander: 1024
    buffer_size_radar: 512

training:
  warmup_episodes: 0
  psro_iterations: 3           # just 3 iterations for quick test
  critic_pretrain_episodes: 5  # 5 demo episodes per team
  critic_pretrain_epochs: 10   # fewer pretrain epochs
  bc_pretrain_epochs: 0
  bc_pretrain_batch_size: 128

reward_shaping:
  detect_snr_weight: 0.1
  detect_coverage_weight: 0.03
  jam_effectiveness_weight: 0.1
  comm_reliability_weight: 0.05
  recon_intel_weight: 0.03
  beam_accuracy_weight: 0.05
  stealth_weight: 0.1
  missile_guidance_weight: 0.02
  snr_threshold_db: 10.0

privileged_critic:
  enabled: true
  encoder_hidden: [256, 128]

env:
  rows: 5
  cols: 5
  num_envs: 4
  n_radars: 4
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  cpi_preallocate: false
  speed_ms: 244.4  # realistic missile speed
