# FluxPhased League Training Configuration — 25×25 Array × 12 Parallel Envs
# Target GPU: RTX PRO 6000 Blackwell (96 GB VRAM)
# Sub-Array Decomposed Policy (SADP): 25 sub-arrays of 5×5 blocks
# Action space: 25×22+3 = 553 (expanded internally to 625×22+3 = 13753)
#
# VRAM budget: ~63 GB / 95 GB (one env at a time — train.py frees init env before phases)
#   Measured: ~5.25 GB/env for 25×25 with CPI preallocation
#   12 envs ≈ 63 GB + model/optimizer ≈ 75 GB total, 20 GB headroom

sub_array_size: 5  # 5×5 sub-array blocks → 25 sub-arrays for 25×25 array

league:
  population_cap: 50
  n_eval_games: 10           # reduced from 50 — 25×25 steps are 40× costlier than 5×5
  meta_solver: "nash"
  pfsp_temperature: 1.0
  exploiter_reset_prob: 0.1
  episodes_per_training: 100  # reduced from 1000 for 25×25
  max_steps_per_episode: 2000  # increased: CRC delay + 600-step flight needs more time
  checkpoint_dir: "checkpoints/league_25x25_12env"
  # alpha_schedule: "linear"  # linear|log|adaptive — TeamCritic trust curve

  mutation:
    enabled: true
    epsilon: 0.05               # std of Gaussian noise added to weights
    n_mutants_per_policy: 3     # copies per winning policy
    n_top_policies: 2           # top-K policies per team to mutate
    win_rate_threshold: 0.55    # min cross-team mean win rate

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999              # 0.99→0.999: effective horizon ~100→~1000 steps
    gae_lambda: 0.99          # 0.95→0.99: GAE horizon ~17→~100 steps
    n_step_returns: 400       # N-step returns for long-horizon credit (0=use GAE)
    value_coef: 0.5
    max_grad_norm: 0.5
    n_epochs: 3               # reduced for 25×25 (each epoch is expensive with 625-element net)
    batch_size: 128         # scaled 2× from 64 (8 envs → 2× batch)
    buffer_size: 2048
    buffer_size_commander: 2048
    buffer_size_radar: 2048   # 8 envs × 200 steps minimum; overflow-safe

training:
  warmup_episodes: 0         # 0 = start directly from PSRO (bidirectional dense reward is enough)
  psro_iterations: 30        # increased from 20 to compensate for removed phases

  # Critic pre-training with scripted demonstration data
  critic_pretrain_episodes: 50    # number of demo episodes to collect (per team)
  critic_pretrain_epochs: 50     # supervised training epochs on collected data

  # BC actor pre-training — Commander learns CRC-based launch from HPEDF demos
  bc_pretrain_epochs: 0          # DISABLED: requires separate data collection, OOM risk
  bc_pretrain_batch_size: 128

reward_shaping:
  detect_snr_weight: 0.1
  detect_coverage_weight: 0.03    # NOW ACTIVE: spatial diversity of detect beams
  jam_effectiveness_weight: 0.1
  comm_reliability_weight: 0.05
  recon_intel_weight: 0.03
  beam_accuracy_weight: 0.05      # NOW ACTIVE: beam pointing accuracy toward target
  stealth_weight: 0.1             # penalty for being intercepted by enemy
  missile_guidance_weight: 0.02   # NEW: reward for missile approaching target
  snr_threshold_db: 10.0
  urgency_penalty: -0.05          # stepped up from -0.01 for Commander launch signal
  team_reward_weight: 0.1         # w1: Σ(all_radar_rewards) in R_team
  team_kill_weight: 1.0           # w2: kill/death bonus in R_team

privileged_critic:
  enabled: true
  encoder_hidden: [512, 256]

env:
  rows: 25
  cols: 25
  num_envs: 4               # reduced from 8: 2000 steps + HPEDF adversarial needs more VRAM
  n_radars: 4
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  cpi_preallocate: false  # streaming FFT saves ~18 GB VRAM for 25×25
  speed_ms: 62500.0  # ~25 m/step (0.4ms CPI) → 15km in ~600 steps (vs 153k at 244.4 m/s)
