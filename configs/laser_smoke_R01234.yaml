# SMOKE TEST for R0-R5 AlphaStar league fixes. Verifies F1-F4 (no NaN crash),
# R1+R2 (self-play + K opponents), R3 (f_hard PFSP), R4 (strong anchor reset),
# R5 (Nash eval-only). Tiny scale: 2 iters × 2 episodes × 100 steps.
# RUN: python -m training.train --config configs/laser_smoke_R01234.yaml
# PASS: completes 2 PSRO iters without NaN; all 6 trainers produce checkpoints.

task_type: laser
sub_array_size: 5

league:
  population_cap: 12
  n_eval_games: 2
  meta_solver: "nash"
  pfsp_temperature: 1.0
  pfsp_hardness_p: 1.0
  self_play_prob_ma: 0.5
  n_opponents_per_cycle_ma: 2     # smaller K for smoke (4 in prod)
  exploiter_reset_prob: 0.5       # higher to exercise R4 reset path
  episodes_per_training: 2
  max_steps_per_episode: 100      # shorter than prod (500)
  checkpoint_dir: "checkpoints/smoke_R01234"
  use_elo_band: false             # exercise pure PFSP path (R3)
  alpha_schedule: linear
  team_critic_enabled: true
  tcdams_lambda: 0.3
  mutation:
    enabled: false                # off for smoke speed

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 2
    batch_size: 64
    buffer_size: 256
    buffer_size_commander: 256
    buffer_size_radar: 128
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 2           # smoke: just 2 iters
  kill_radius_init: 50.0
  kill_rate_threshold: 0.5
  kill_radius_decay: 0.5
  residual_aim: true
  residual_scale_m: 6.0
  hybrid_fire: true
  decouple_value: true
  fire_init_logit: 1.0
  log_std_floor: -3.0         # F3: prevent σ collapse
  warmup_episodes: 0
  critic_pretrain_episodes: 0
  bc_pretrain_epochs: 0

reward_shaping:
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 100.0
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 5.0
  illum_reward_weight: 50.0
  fire_lock_bonus: 5.0
  misfire_penalty: 0.5
  fire_commitment_weight: 8.0
  fire_commitment_cap: 4.0
  fire_commitment_exp: 2.0
  illum_dwell_exp: 2.0
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05

env:
  min_radar_baseline_m: 5000.0
  rows: 25
  cols: 25
  num_envs: 4                  # smaller batch for smoke
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.2
  illumination_time_s: 0.002
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]

sensing_noise:
  mode: tracked
  track_q_m: 0.02
  track_burnin: 120
  acq_baseline_m: 0.0
  range_sigma_m: 0.05
  crossrange_factor: 7.4e-5
