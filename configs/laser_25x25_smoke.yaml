# Smoke test: 25×25 laser, minimal scale — verifies the fix runs end-to-end on GPU.
# 1 env, 1 PSRO iter, 1 short episode. NOT a training run (won't achieve kills).

sub_array_size: 5

league:
  population_cap: 10
  episodes_per_training: 1
  max_steps_per_episode: 150     # ~30 NN control steps (pulses_per_control=5)
  checkpoint_dir: "/tmp/laser_smoke_ckpt"

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 3
    batch_size: 128
    buffer_size: 512
    buffer_size_commander: 512
    buffer_size_radar: 512
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 1
  hybrid_fire: true
  kill_radius_init: 50.0
  cmd_bc_weight_init: 1.0
  cmd_bc_weight_final: 0.1
  cmd_bc_decay_iters: 10
  log_std_init: -1.0
  log_std_floor: -6.0
  log_std_decay: 0.20

reward_shaping:
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 100.0
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 5.0
  illum_reward_weight: 50.0
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05

env:
  rows: 25
  cols: 25
  num_envs: 1
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.2
  illumination_time_s: 0.002
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]
