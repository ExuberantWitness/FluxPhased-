# ============================================================================
# EW-IPPO config — Gate 0 验证 EW 任务下 classical 是否失效(无 CTDE 对照)
# ============================================================================
# WHAT: ippo base + EW 段(同 ew_mappo):
#   training.jam_log_std=-1, jam_kr_threshold_m=0.5, commander_privileged_dim=10
#   reward_shaping: jam_gain=8, jam_cost=0.01, exposure_gain=50,
#                   race_time_cost=0.01, race_death_penalty=30
# WHY:  Gate 0 的无-CTDE 对照臂 — 和 ew_mappo 形成 "EW 下 CTDE 的效应" 对比
#      (镜像 phase1.5 的 IPPO vs MAPPO 分离逻辑,只不过叠加 EW 任务)
# CHANGE vs ippo/code/config.yaml:
#   - header             → EW-IPPO gate-0 注释
#   - checkpoint_dir     → algo/ew_ippo/data
#   - use_mappo: false   (per-agent critic — 与 ew_mappo 形成 CTDE 对比)
#   - training: +3 EW 字段
#   - reward_shaping: +5 EW 字段
#   - env.kill_radius_m: 0.5 → 0.2
# ============================================================================

sub_array_size: 5
seed: 42                    # 同 ippo + ew_mappo (bit-exact 可复现)

league:
  population_cap: 30
  episodes_per_training: 10
  max_steps_per_episode: 500
  checkpoint_dir: "/home/ubuntu/CODE/FluxPhased-/algo/ew_ippo/data/checkpoints"
  n_eval_games: 10
  pfsp_p: 0                 # 关 PFSP → 均匀采样

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 3
    batch_size: 256
    buffer_size: 2048
    buffer_size_commander: 2048
    buffer_size_radar: 2048
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 20
  league: true
  league_snapshot_every: 3
  reward_normalize: true
  use_mappo: false          # per-agent critic — EW 下 IPPO 对照
  # --- EW 段(plan §Gate 0 step 1)---
  jam_log_std: -1.0
  jam_kr_threshold_m: 0.5
  commander_privileged_dim: 10
  # --- below: IDENTICAL to ippo stable ---
  hybrid_fire: true
  residual_aim: true
  residual_scale_m: 6.0
  kill_radius_init: 50.0
  bc_pretrain_iters: 0
  cmd_bc_weight_init: 5.0
  cmd_bc_weight_final: 2.0
  cmd_bc_decay_iters: 24
  log_std_init: -1.0
  log_std_floor: -4.0
  log_std_decay: 0.40

reward_shaping:
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 100.0
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 2.0
  illum_reward_weight: 50.0
  fire_lock_bonus: 5.0
  misfire_penalty: 0.5
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05
  dartboard_weight: 0.0
  dartboard_scale_m: 5.0
  # --- EW 段(plan §Gate 0 step 1)---
  race_time_cost: 0.01
  race_death_penalty: 30.0
  jam_gain: 8.0
  jam_cost: 0.01
  exposure_gain: 50.0

env:
  min_radar_baseline_m: 5000.0
  rows: 25
  cols: 25
  num_envs: 12
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.2        # 0.5→0.2:让 curriculum 经过 0.5 触发 jam_on
  illumination_time_s: 0.002
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]

sensing_noise:
  mode: tracked
  track_q_m: 0.02
  track_burnin: 120
  acq_baseline_m: 0.0
  range_sigma_m: 0.05
  crossrange_factor: 7.4e-5
