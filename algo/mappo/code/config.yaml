# ============================================================================
# MAPPO baseline config — Phase 1.5 三方对比 (APP-compliant copy)
# ============================================================================
# WHAT: same env/reward/curriculum as PfspFix stable, BUT:
#       (1) use_mappo=true  → team critic (CTDE) instead of per-agent critic
#       (2) pfsp_p=0        → uniform opponent sampling (关掉 PFSP f_hard 优势)
# WHY:  EAAI reviewer asks "why AlphaStar league instead of MAPPO?"
#       This run answers: under same recipe, does team critic + uniform pool
#       beat / match / lose to PFSP league?
# RUN:  bash algorithms/mappo/code/run.sh
# BASE: frozen at commit 5c24f0d (Phase 1.5 MAPPO baseline)
# GATE: vs PfspFix iter 20 (cum red 0.81, eval_kill_rate 0.667, aim_res 0.034m)
# ============================================================================
# DIFF vs configs/laser_25x25_mappo.yaml:
#   header           → APP-compliant mappo 注释
#   checkpoint_dir   → absolute path to algorithms/mappo/data/checkpoints
# (algorithm values bit-exact identical; only path resolution differs)
# ============================================================================

sub_array_size: 5
seed: 42                    # 同 PfspFix (bit-exact 可复现)

league:
  population_cap: 30
  episodes_per_training: 10
  max_steps_per_episode: 500
  checkpoint_dir: "/home/ubuntu/CODE/FluxPhased-/algorithms/mappo/data/checkpoints"
  n_eval_games: 10
  pfsp_p: 0                 # 关 PFSP → 均匀采样 (公平 IPPO/MAPPO baseline)

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 3
    batch_size: 256
    buffer_size: 2048
    buffer_size_commander: 2048
    buffer_size_radar: 2048
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 20
  league: true
  league_snapshot_every: 3
  reward_normalize: true
  use_mappo: true           # 开 team critic (CTDE) — MAPPO 关键差异
  # --- below: IDENTICAL to PfspFix stable ---
  hybrid_fire: true
  residual_aim: true
  residual_scale_m: 6.0
  kill_radius_init: 50.0
  bc_pretrain_iters: 0
  cmd_bc_weight_init: 5.0
  cmd_bc_weight_final: 2.0
  cmd_bc_decay_iters: 24
  log_std_init: -1.0
  log_std_floor: -4.0
  log_std_decay: 0.40

reward_shaping:
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 100.0
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 2.0
  illum_reward_weight: 50.0
  fire_lock_bonus: 5.0
  misfire_penalty: 0.5
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05
  dartboard_weight: 0.0
  dartboard_scale_m: 5.0

env:
  min_radar_baseline_m: 5000.0
  rows: 25
  cols: 25
  num_envs: 12
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.5
  illumination_time_s: 0.002
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]

sensing_noise:
  mode: tracked
  track_q_m: 0.02
  track_burnin: 120
  acq_baseline_m: 0.0
  range_sigma_m: 0.05
  crossrange_factor: 7.4e-5
