# Smoke test for EW-MAPPO — 2 iter × 1 episode, num_envs=2 (fast, ~3-5 min)
# Used to validate the EW injection doesn't break PPO before launching full 20 iter.
# DO NOT use for the real Gate 0 eval — this is just a build/sanity check.

sub_array_size: 5
seed: 42

league:
  population_cap: 30
  episodes_per_training: 1
  max_steps_per_episode: 500
  checkpoint_dir: "/home/ubuntu/CODE/FluxPhased-/algo/ew_mappo/data/checkpoints"
  n_eval_games: 2
  pfsp_p: 0

ppo:
  commander:
    lr: 3.0e-4
    clip_range: 0.2
    entropy_coef: 0.01
  radar:
    lr: 1.0e-4
    clip_range: 0.1
    entropy_coef: 0.02
  shared:
    gamma: 0.999
    gae_lambda: 0.99
    n_epochs: 3
    batch_size: 64
    buffer_size: 256
    buffer_size_commander: 256
    buffer_size_radar: 256
    value_coef: 1.0
    vf_clip_range: 10.0
    max_grad_norm: 0.5

training:
  psro_iterations: 2
  league: true
  league_snapshot_every: 1
  reward_normalize: true
  use_mappo: true
  jam_log_std: -1.0
  jam_kr_threshold_m: 0.5
  commander_privileged_dim: 10
  hybrid_fire: true
  residual_aim: true
  residual_scale_m: 6.0
  kill_radius_init: 50.0
  bc_pretrain_iters: 0
  cmd_bc_weight_init: 5.0
  cmd_bc_weight_final: 2.0
  cmd_bc_decay_iters: 4
  log_std_init: -1.0
  log_std_floor: -4.0
  log_std_decay: 0.40

reward_shaping:
  detect_snr_weight: 0.1
  beam_accuracy_weight: 5.0
  illumination_progress_weight: 1.0
  kill_bonus: 100.0
  death_penalty: -10.0
  emission_cost: -0.001
  snr_threshold_db: 10.0
  team_reward_weight: 0.1
  team_kill_weight: 1.0
  beam_guidance_weight: 2.0
  illum_reward_weight: 50.0
  fire_lock_bonus: 5.0
  misfire_penalty: 0.5
  beam_r_ref_m: 3000.0
  beam_r_floor_m: 0.2
  beam_reward_weight: 5.0
  beam_hit_radius_m: 500.0
  beam_spatial_cap: 1000.0
  beam_temporal_epsilon: 0.05
  dartboard_weight: 0.0
  dartboard_scale_m: 5.0
  race_time_cost: 0.01
  race_death_penalty: 30.0
  jam_gain: 8.0
  jam_cost: 0.01
  exposure_gain: 50.0

env:
  min_radar_baseline_m: 5000.0
  rows: 25
  cols: 25
  num_envs: 2
  n_radars: 4
  n_teams: 2
  pulses_per_cpi: 4
  fft_size: 64
  device: "cuda"
  tx_power_w: 1.0
  prf: 10000.0
  pulses_per_control: 5
  bandwidth: 200000000.0
  vehicle_speed_ms: 20.0
  kill_radius_m: 0.2
  illumination_time_s: 0.002
  drone_altitude_m: 3000.0
  map_size: [20000.0, 20000.0]

sensing_noise:
  mode: tracked
  track_q_m: 0.02
  track_burnin: 120
  acq_baseline_m: 0.0
  range_sigma_m: 0.05
  crossrange_factor: 7.4e-5
